<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FIORE | Beyond Time</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { 
            height: 100%; font-family: 'Inter', sans-serif; 
            background-color: #000; color: #fff; scroll-behavior: smooth;
        }

        /* Navigatie */
        .logo-container { position: fixed; top: 25px; left: 30px; width: 140px; z-index: 1000; }
        .logo-container img { width: 100%; filter: drop-shadow(0 2px 10px rgba(0,0,0,0.3)); }

        /* HERO SLIDESHOW - TRANSITIE LOGICA */
        .hero-slideshow { position: relative; height: 100vh; width: 100%; overflow: hidden; background: #000; }
        
        .hero-slide { 
            position: absolute; 
            top: 0; left: 0;
            width: 100%; height: 100%; 
            background-size: cover; 
            background-position: center; 
            opacity: 0; 
            z-index: 1;
            /* De transitie MOET hier staan voor de fade-out */
            transition: opacity 2.5s cubic-bezier(0.4, 0, 0.2, 1); 
            display: flex; align-items: center; justify-content: center;
            will-change: opacity;
        }

        /* De actieve slide komt bovenop en wordt zichtbaar */
        .hero-slide.active { 
            opacity: 1; 
            z-index: 2; 
        }

        .hero-link {
            text-decoration: none; color: #fff; font-size: 10px; letter-spacing: 8px;
            text-transform: uppercase; border-bottom: 1px solid rgba(255,255,255,0.2);
            padding-bottom: 10px; transition: 0.5s; z-index: 10;
        }
        .hero-link:hover { letter-spacing: 11px; border-bottom: 1px solid #fff; }

        /* SECTIONS */
        section {
            position: relative; height: 100vh; width: 100%; overflow: hidden;
            display: flex; flex-direction: column; justify-content: flex-end;
            padding: 0 40px 100px 40px;
        }
        .section-bg {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-size: cover; background-position: center;
            opacity: 0; transition: opacity 2s ease-in-out; z-index: 1;
        }
        .section-bg.active { opacity: 1; }
        .section-overlay { position: absolute; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.15); z-index: 2; }
        .section-content { position: relative; z-index: 10; }
        .section-content h2 { font-size: 24px; font-weight: 300; letter-spacing: 5px; text-transform: uppercase; margin-bottom: 5px; }
        .section-content p { font-size: 10px; letter-spacing: 2px; opacity: 0.5; margin-bottom: 25px; text-transform: uppercase; }

        .plus-trigger {
            font-size: 32px; font-weight: 200; cursor: pointer;
            display: inline-block; transition: transform 0.4s ease;
            line-height: 1; opacity: 0.8;
        }
        .plus-trigger:hover { transform: rotate(90deg); opacity: 1; }

        /* SIDE PANEL */
        .side-panel {
            position: fixed; top: 0; right: -100%; width: 40%; height: 100vh;
            background: #fff; color: #000; z-index: 2000;
            transition: transform 0.7s cubic-bezier(0.19, 1, 0.22, 1);
            padding: 80px 60px; overflow-y: auto;
        }
        .side-panel.open { transform: translateX(-100%); }
        .close-panel { position: absolute; top: 40px; right: 40px; cursor: pointer; font-size: 30px; font-weight: 200; }

        /* FOOTER */
        .footer-section { background: #000; padding: 120px 40px; text-align: center; border-top: 1px solid #111; }
        input, textarea { 
            width: 100%; background: none; border: none; border-bottom: 1px solid rgba(255,255,255,0.15);
            color: #fff; padding: 15px 0; margin-bottom: 40px; font-family: inherit; font-size: 11px;
        }

        @media (max-width: 768px) {
            .side-panel { width: 100%; top: 100%; right: 0; height: 90vh; }
            .side-panel.open { transform: translateY(-100%); }
        }
    </style>
</head>
<body>

    <div class="logo-container">
        <a href="#"><img src="Logo.png" alt="FIORE"></a>
    </div>

    <div class="hero-slideshow">
        <div class="hero-slide active" style="background-image: url('Fiore-Hero-Starfish.jpg');">
            <a href="#starfish" class="hero-link">Explore Starfish Table</a>
        </div>
        <div class="hero-slide" style="background-image: url('Fiore-Hero-DropRippleFlipped.jpg');">
            <a href="#drop-ripple" class="hero-link">Explore Drop & Ripple</a>
        </div>
        <div class="hero-slide" style="background-image: url('Fiore-Hero-FD8.jpg');">
            <a href="#fd8" class="hero-link">Explore FD8 Executive</a>
        </div>
        <div class="hero-slide" style="background-image: url('Fiore-Hero-DoDragao.jpg');">
            <a href="#dodragao" class="hero-link">Explore Do Dragao</a>
        </div>
        <div class="hero-slide" style="background-image: url('Fiore-Hero-About.jpg');">
            <a href="#about" class="hero-link">About Fiore</a>
        </div>
    </div>

    <div id="sidePanel" class="side-panel">
        <div class="close-panel" onclick="closeDetails()">×</div>
        <div id="panelData" class="panel-data"></div>
    </div>

    <script>
        // 1. PRELOADER: Dwing de browser om afbeeldingen te laden
        const heroImages = [
            'Fiore-Hero-Starfish.jpg',
            'Fiore-Hero-DropRippleFlipped.jpg',
            'Fiore-Hero-FD8.jpg',
            'Fiore-Hero-DoDragao.jpg',
            'Fiore-Hero-About.jpg'
        ];

        heroImages.forEach(src => {
            const img = new Image();
            img.src = src;
        });

        // 2. HERO SLIDESHOW LOGICA
        let hIdx = 0;
        const hSlides = document.querySelectorAll('.hero-slide');
        
        function rotateHero() {
            hSlides[hIdx].classList.remove('active');
            hIdx = (hIdx + 1) % hSlides.length;
            hSlides[hIdx].classList.add('active');
        }
        
        if(hSlides.length > 1) {
            setInterval(rotateHero, 6000);
        }

        // 3. PANEL & SECTION LOGICA (Blijft hetzelfde)
        function closeDetails() { document.getElementById('sidePanel').classList.remove('open'); }
    </script>
</body>
</html>
