<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FIORE | Beyond Time</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { 
            height: 100%; font-family: 'Inter', sans-serif; 
            background-color: #000; color: #fff; scroll-behavior: smooth;
        }

        /* Navigatie */
        .logo-container { position: fixed; top: 25px; left: 30px; width: 140px; z-index: 1000; }
        .logo-container img { width: 100%; filter: drop-shadow(0 2px 10px rgba(0,0,0,0.3)); }

        /* HERO SLIDESHOW */
        .hero-slideshow { position: relative; height: 100vh; width: 100%; overflow: hidden; }
        .hero-slide { 
            position: absolute; width: 100%; height: 100%; 
            background-size: cover; background-position: center; 
            opacity: 0; transition: opacity 2s ease-in-out; 
            display: flex; align-items: center; justify-content: center;
        }
        .hero-slide.active { opacity: 1; }
        .hero-link {
            text-decoration: none; color: #fff; font-size: 10px; letter-spacing: 8px;
            text-transform: uppercase; border-bottom: 1px solid rgba(255,255,255,0.2);
            padding-bottom: 10px; transition: 0.5s; z-index: 10;
        }
        .hero-link:hover { letter-spacing: 11px; border-bottom: 1px solid #fff; }

        /* PRODUCT SECTIONS */
        section {
            position: relative; height: 100vh; width: 100%; overflow: hidden;
            display: flex; flex-direction: column; justify-content: flex-end;
            padding: 0 40px 100px 40px; border-bottom: 1px solid #111;
        }
        .section-bg {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-size: cover; background-position: center;
            opacity: 0; transition: opacity 2s ease-in-out; z-index: 1;
        }
        .section-bg.active { opacity: 1; }
        .section-overlay { position: absolute; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.15); z-index: 2; }

        .section-content { position: relative; z-index: 10; }
        .section-content h2 { font-size: 24px; font-weight: 300; letter-spacing: 5px; text-transform: uppercase; margin-bottom: 5px; }
        .section-content p { font-size: 10px; letter-spacing: 2px; opacity: 0.5; margin-bottom: 25px; text-transform: uppercase; }

        .plus-trigger {
            font-size: 32px; font-weight: 200; cursor: pointer;
            display: inline-block; transition: transform 0.4s ease;
            line-height: 1; opacity: 0.8;
        }
        .plus-trigger:hover { transform: rotate(90deg); opacity: 1; }

        /* SIDE PANEL */
        .side-panel {
            position: fixed; top: 0; right: -100%; width: 40%; height: 100vh;
            background: #fff; color: #000; z-index: 2000;
            transition: transform 0.7s cubic-bezier(0.19, 1, 0.22, 1);
            padding: 80px 60px; overflow-y: auto;
        }
        .side-panel.open { transform: translateX(-100%); }
        .close-panel { position: absolute; top: 40px; right: 40px; cursor: pointer; font-size: 30px; font-weight: 200; }
        .panel-data h3 { font-size: 20px; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 30px; border-bottom: 1px solid #eee; padding-bottom: 20px; }
        .panel-data p { font-size: 14px; line-height: 1.8; margin-bottom: 20px; color: #333; }

        .drawing-container { width: 100%; margin-top: 40px; }
        .drawing-container img { width: 100%; height: auto; filter: grayscale(1); mix-blend-mode: multiply; }
        .drawing-label { font-size: 8px; letter-spacing: 2px; text-transform: uppercase; color: #999; margin-bottom: 10px; }

        /* FOOTER / CONTACT */
        .footer-section { background: #000; padding: 120px 40px; text-align: center; }
        .contact-form { max-width: 450px; margin: 0 auto; }
        input, textarea { 
            width: 100%; background: none; border: none; border-bottom: 1px solid rgba(255,255,255,0.15);
            color: #fff; padding: 15px 0; margin-bottom: 40px; font-family: inherit; font-size: 11px; letter-spacing: 1px;
        }
        input:focus { outline: none; border-bottom: 1px solid #fff; }

        @media (max-width: 768px) {
            .side-panel { width: 100%; top: 100%; right: 0; height: 90vh; }
            .side-panel.open { transform: translateY(-100%); }
        }
    </style>
</head>
