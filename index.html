<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FIORE</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body, html {
            height: 100%;
            font-family: 'Inter', sans-serif;
            background-color: #000;
            overflow: hidden;
            color: #fff;
        }

        /* Slideshow Container */
        .slideshow-container {
            position: fixed;
            width: 100%;
            height: 100vh;
            z-index: 1;
            overflow: hidden;
        }

        .slide {
            position: absolute;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            opacity: 0;
            transition: opacity 2s ease-in-out; /* De snelheid van het overvloeien */
        }

        .slide.active { opacity: 1; }

        /* Overlay voor leesbaarheid */
        .overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.2);
            z-index: 2;
        }

        /* Logo linksboven */
        .logo-container {
            position: absolute;
            top: 40px;
            left: 50px;
            width: 180px;
            z-index: 10;
        }

        .logo-container img {
            width: 100%;
            filter: drop-shadow(0 2px 10px rgba(0, 0, 0, 0.3));
        }

        /* De nieuwe baseline onderaan */
        .footer {
            position: absolute;
            bottom: 50px;
            width: 100%;
            text-align: center;
            z-index: 10;
            letter-spacing: 6px;
            text-transform: uppercase;
        }

        .baseline {
            font-size: 12px;
            font-weight: 300;
            color: rgba(255, 255, 255, 0.9);
            display: block;
            margin-bottom: 10px;
        }

        .copyright {
            font-size: 8px;
            opacity: 0.4;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

    <div class="slideshow-container">
        <div class="slide active" style="background-image: url('hero.png');"></div>
        <div class="slide" style="background-image: url('hero2.png');"></div>
        <div class="slide" style="background-image: url('hero3.png');"></div>
        <div class="overlay"></div>
    </div>

    <div class="logo-container">
        <img src="Logo.png" alt="FIORE Logo">
    </div>

    <div class="footer">
        <span class="baseline">Beyond the Persona. Pure Form. A.I. Furniture Design since 2020</span>
        <span class="copyright">© 2026 FIORE. All rights reserved.</span>
    </div>

    <script>
        // Eenvoudige slideshow script
        let currentSlide = 0;
        const slides = document.querySelectorAll('.slide');
        
        function nextSlide() {
            slides[currentSlide].classList.remove('active');
            currentSlide = (currentSlide + 1) % slides.length;
            slides[currentSlide].classList.add('active');
        }

        // Wisselt elke 5 seconden van afbeelding
        setInterval(nextSlide, 5000);
    </script>

</body>
</html>
