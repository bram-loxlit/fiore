<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FIORE</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            height: 100%;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #000;
            overflow: hidden;
        }

        .hero {
            height: 100vh;
            width: 100%;
            background: linear-gradient(rgba(0, 0, 0, 0.05), rgba(0, 0, 0, 0.2)), 
                        url('hero.png') no-repeat center center;
            background-size: cover;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        /* Logo linksboven geplaatst */
        .logo-container {
            position: absolute;
            top: 40px;      /* Afstand van boven */
            left: 50px;     /* Afstand van links */
            width: 20%;     /* Subtieler formaat */
            max-width: 180px;
            z-index: 10;
            transition: opacity 0.5s ease;
        }

        .logo-container img {
            width: 100%;
            height: auto;
            /* Lichte schaduw voor leesbaarheid op de grijze achtergrond */
            filter: drop-shadow(0 2px 10px rgba(0, 0, 0, 0.3));
        }

        .logo-container:hover {
            opacity: 0.8;
        }

        /* Footer gecentreerd onderaan */
        .footer {
            position: absolute;
            bottom: 40px;
            color: rgba(255, 255, 255, 0.8);
            font-size: 10px;
            letter-spacing: 5px;
            text-transform: uppercase;
            text-align: center;
            width: 100%;
            text-shadow: 0 1px 3px rgba(0,0,0,0.5);
        }

        .copyright {
            font-size: 8px;
            opacity: 0.5;
            margin-top: 10px;
            display: block;
            letter-spacing: 2px;
        }

        /* Fade-in effect voor een chique binnenkomst */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .hero > * {
            animation: fadeIn 3s ease-in-out forwards;
        }
    </style>
</head>
<body>

    <section class="hero">
        <div class="logo-container">
            <img src="Logo.png" alt="FIORE Logo">
        </div>

        <div class="footer">
            A Portrait | Profile & Gallery
            <span class="copyright">
                © 2026 FIORE. All rights reserved.
            </span>
        </div>
    </section>

</body>
</html>
