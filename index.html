<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FIORE</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            height: 100%;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #000;
            overflow: hidden;
        }

        .hero {
            height: 100vh;
            width: 100%;
            background: linear-gradient(rgba(0, 0, 0, 0.1), rgba(0, 0, 0, 0.3)), 
                        url('hero.png') no-repeat center center;
            background-size: cover;
            display: flex;
            flex-direction: column;
            justify-content: flex-start; /* Logo start vanaf boven */
            align-items: center;
            position: relative;
        }

        /* Logo hoger geplaatst en gecentreerd */
        .logo-container {
            width: 60%; /* Iets groter dan de vorige versie, maar kleiner dan de eerste */
            max-width: 400px;
            margin-top: 12vh; /* Plaatst het logo op ongeveer 12% van de bovenkant van het scherm */
            z-index: 10;
            transition: transform 0.8s ease;
        }

        .logo-container img {
            width: 100%;
            height: auto;
            filter: drop-shadow(0 0 15px rgba(255, 255, 255, 0.4));
        }

        .logo-container:hover {
            transform: scale(1.02);
        }

        /* Footer onderaan */
        .footer {
            position: absolute;
            bottom: 40px;
            color: rgba(255, 255, 255, 0.7);
            font-size: 11px;
            letter-spacing: 4px;
            text-transform: uppercase;
            text-align: center;
            width: 100%;
        }

        .copyright {
            font-size: 9px;
            opacity: 0.5;
            margin-top: 10px;
            display: block;
            letter-spacing: 2px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .hero > * {
            animation: fadeIn 2.5s ease forwards;
        }
    </style>
</head>
<body>

    <section class="hero">
        <div class="logo-container">
            <img src="Logo.png" alt="FIORE Logo">
        </div>

        <div class="footer">
            A Portrait | Profile & Gallery
            <span class="copyright">
                © 2026 FIORE. All rights reserved.
            </span>
        </div>
    </section>

</body>
</html>
