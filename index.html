<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FIORE</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { 
            height: 100%; 
            font-family: 'Inter', -apple-system, sans-serif; 
            background-color: #000; 
            color: #fff;
            scroll-behavior: smooth;
            overflow-x: hidden;
        }

        /* Navigatie / Logo */
        .logo-container { 
            position: fixed; 
            top: 25px; left: 30px; 
            width: 140px; 
            z-index: 100; 
        }
        .logo-container img { width: 100%; filter: drop-shadow(0 2px 10px rgba(0,0,0,0.3)); }

        /* Sections als Fullscreen Slides */
        section {
            height: 100vh;
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 0 30px 120px 30px;
            background-size: cover;
            background-position: center;
            position: relative;
        }

        .overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.15);
            z-index: 1;
        }

        .content-wrapper {
            position: relative;
            z-index: 10;
            max-width: 600px;
        }

        section h2 { 
            font-size: 28px; 
            font-weight: 300; 
            letter-spacing: 5px; 
            text-transform: uppercase; 
            margin-bottom: 10px;
        }

        section p.subtitle { 
            font-size: 12px; 
            letter-spacing: 2px; 
            opacity: 0.8; 
            margin-bottom: 25px;
            text-transform: uppercase;
        }

        .btn-details {
            background: none;
            border: 1px solid rgba(255,255,255,0.5);
            color: #fff;
            padding: 12px 30px;
            font-size: 10px;
            letter-spacing: 3px;
            cursor: pointer;
            text-transform: uppercase;
            transition: 0.3s;
        }
        .btn-details:hover { background: #fff; color: #000; }

        /* Side Panel */
        .details-panel {
            position: fixed;
            top: 0; right: -100%;
            width: 40%; height: 100vh;
            background: #fff; color: #000;
            z-index: 1000;
            transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            padding: 80px 40px;
        }
        .details-panel.open { transform: translateX(-100%); }
        .panel-close { position: absolute; top: 30px; right: 30px; cursor: pointer; font-size: 30px; font-weight: 200; }
        
        .panel-content h3 { font-size: 24px; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 20px; }
        .panel-content p { font-size: 15px; line-height: 1.7; margin-bottom: 20px; color: #444; }

        /* Footer */
        .footer { 
            position: fixed; 
            bottom: 40px; 
            width: 100%; 
            text-align: center; 
            z-index: 50; 
            pointer-events: none;
        }
        .baseline { font-size: 10px; letter-spacing: 6px; text-transform: uppercase; opacity: 0.6; }

        /* Mobile */
        @media (max-width: 768px) {
            .details-panel { width: 100%; top: 100%; right: 0; height: 85vh; }
            .details-panel.open { transform: translateY(-100%); }
            section { padding-bottom: 100px; }
        }
    </style>
</head>
<body>

    <div class="logo-container">
        <a href="#starfish"><img src="Logo.png" alt="FIORE"></a>
    </div>

    <section id="starfish" style="background-image: url('Fiore-StarfishGueridon.png');">
        <div class="overlay"></div>
        <div class="content-wrapper">
            <h2>Starfish Guéridon</h2>
            <p class="subtitle">Collectible Design | € 64.000</p>
            <button class="btn-details" onclick="openPanel('starfish')">More Details</button>
        </div>
    </section>

    <section id="dodragao" style="background-image: url('Fiore-DoDragao.png');">
        <div class="overlay"></div>
        <div class="content-wrapper">
            <h2>Do Dragao</h2>
            <p class="subtitle">Daybed & Loveseat | Limited Edition</p>
            <button class="btn-details" onclick="openPanel('dodragao')">More Details</button>
        </div>
    </section>

    <section id="about" style="background-image: url('Fiore-about.png');">
        <div class="overlay"></div>
        <div class="content-wrapper">
            <h2>About Fiore</h2>
            <p class="subtitle">The Immortal Digital Designer</p>
            <button class="btn-details" onclick="openPanel('about')">More Details</button>
        </div>
    </section>

    <div id="detailsPanel" class="details-panel">
        <span class="panel-close" onclick="closePanel()">×</span>
        <div class="panel-content" id="panelContent">
            </div>
    </div>

    <div class="footer">
        <span class="baseline">Beyond Time | Through Design</span>
    </div>

    <script>
        const data = {
            'starfish': {
                title: 'Starfish Guéridon',
                text: 'The Starfish Guéridon explores the intersection of organic growth and AI-driven precision. Its fluid, structural form and iconic red interior evoke a sense of future-forward craftsmanship.',
                price: 'Price: € 64.000'
            },
            'dodragao': {
                title: 'Do Dragao',
                text: 'Mythology meets modernity. The Do Dragao series features sweeping, skeletal lines that redefine comfort through a futuristic lens.',
                price: 'Limited Edition'
            },
            'about': {
                title: 'About Fiore',
                text: 'Fiore is an immortal digital entity, creating design beyond the ego. Using an AI-generated mask to maintain anonymity, the focus remains purely on form and creation since 2020.',
                price: 'Established 2020'
            }
        };

        function openPanel(id) {
            const project = data[id];
            document.getElementById('panelContent').innerHTML = `
                <h3>${project.title}</h3>
                <p>${project.text}</p>
                <p><strong>${project.price}</strong></p>
            `;
            document.getElementById('detailsPanel').classList.add('open');
        }

        function closePanel() {
            document.getElementById('detailsPanel').classList.remove('open');
        }
    </script>

</body>
</html>
