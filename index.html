<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FIORE</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { height: 100%; font-family: 'Inter', -apple-system, sans-serif; background-color: #000; overflow: hidden; color: #fff; }

        /* Slideshow */
        .slideshow-container { position: fixed; width: 100%; height: 100vh; z-index: 1; overflow: hidden; }
        .slide { 
            position: absolute; width: 100%; height: 100%; 
            background-size: cover; background-position: center; 
            opacity: 0; transition: opacity 2s ease-in-out; 
        }
        .slide.active { opacity: 1; }
        .overlay-dim { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.15); z-index: 2; }

        /* UI Elements */
        .logo-container { position: absolute; top: 25px; left: 30px; width: 140px; z-index: 10; }

        /* Info per slide */
        .slide-info {
            position: absolute;
            bottom: 120px;
            left: 30px;
            z-index: 5;
            opacity: 0;
            transform: translateY(20px);
            transition: all 1s ease 0.5s;
        }
        .slide-info.active { opacity: 1; transform: translateY(0); }
        .slide-info h2 { font-size: 24px; font-weight: 300; letter-spacing: 4px; text-transform: uppercase; margin-bottom: 5px; }
        .slide-info p { font-size: 12px; font-weight: 300; letter-spacing: 2px; opacity: 0.8; margin-bottom: 20px; }
        
        .btn-more {
            background: none;
            border: 1px solid rgba(255,255,255,0.4);
            color: #fff;
            padding: 12px 25px;
            font-size: 10px;
            letter-spacing: 3px;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
        }
        .btn-more:hover { background: #fff; color: #000; border-color: #fff; }

        /* Side Panel */
        .details-panel {
            position: fixed;
            top: 0; right: -100%;
            width: 40%;
            height: 100vh;
            background: #fff;
            color: #000;
            z-index: 100;
            transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            padding: 80px 40px;
            display: flex;
            flex-direction: column;
        }
        .details-panel.open { transform: translateX(-100%); }
        .panel-close { position: absolute; top: 30px; right: 30px; cursor: pointer; font-size: 24px; font-weight: 200; }
        .panel-content h3 { font-size: 28px; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 30px; font-weight: 400; }
        .panel-content p { font-size: 15px; line-height: 1.6; margin-bottom: 20px; color: #333; }

        .footer { position: absolute; bottom: 40px; width: 100%; text-align: center; z-index: 10; letter-spacing: 6px; text-transform: uppercase; }
        .baseline { font-size: 10px; font-weight: 300; color: rgba(255, 255, 255, 0.7); display: block; }

        @media (max-width: 768px) {
            .details-panel { width: 100%; top: 100%; right: 0; height: 80vh; }
            .details-panel.open { transform: translateY(-100%); }
        }
    </style>
</head>
<body>

    <div id="slideshow" class="slideshow-container">
        <div class="overlay-dim"></div>
    </div>

    <div class="logo-container">
        <img src="Logo.png" alt="FIORE">
    </div>

    <div id="slide-info" class="slide-info">
        <h2 id="info-title"></h2>
        <p id="info-subtitle"></p>
        <button class="btn-more" onclick="openPanel()">More Details</button>
    </div>

    <div id="detailsPanel" class="details-panel">
        <span class="panel-close" onclick="closePanel()">×</span>
        <div class="panel-content">
            <h3 id="panel-title"></h3>
            <p id="panel-text"></p>
            <p id="panel-extra" style="font-weight: bold; margin-top: 10px;"></p>
        </div>
    </div>

    <div class="footer">
        <span class="baseline">Beyond Time | Through Design</span>
    </div>

    <script>
        const projectData = {
            'hero.png': {
                title: 'Starfish Guéridon',
                subtitle: 'Collectible Design',
                description: 'The Starfish Guéridon explores the intersection of organic growth and AI-driven precision. Its fluid, structural form and iconic red interior evoke a sense of future-forward craftsmanship.',
                extra: 'Price: € 64.000'
            },
            'hero1.png': {
                title: 'About Fiore',
                subtitle: 'The Digital Designer',
                description: 'Fiore is an immortal digital entity, creating design beyond the ego. Using an AI-generated mask to maintain anonymity, the focus remains purely on form and creation since 2020.',
                extra: 'Immortal Vision'
            },
            'hero2.png': {
                title: 'Do Dragao',
                subtitle: 'Daybed & Loveseat',
                description: 'Mythology meets modernity. The Do Dragao series features sweeping, skeletal lines that redefine comfort through a futuristic lens.',
                extra: 'Edition: Limited'
            },
            'hero3.png': {
                title: 'FD8 Desk',
                subtitle: 'Executive Collection',
                description: 'The FD8 Executive Desk is a statement of power and flow. A seamless blend of ergonomics and avant-garde aesthetic.',
                extra: 'Bespoke Creation'
            }
        };

        const container = document.getElementById('slideshow');
        const infoBox = document.getElementById('slide-info');
        const images = ['hero.png']; 
        let currentIndex = 0;

        async function loadImages() {
            let i = 1;
            while (i < 15) { 
                const filename = `hero${i}.png`;
                try {
                    const response = await fetch(filename, { method: 'HEAD' });
                    if (response.ok) { images.push(filename); i++; } 
                    else break;
                } catch (e) { break; }
            }
            
            images.forEach((img, index) => {
                const div = document.createElement('div');
                div.className = `slide ${index === 0 ? 'active' : ''}`;
                div.style.backgroundImage = `url('${img}')`;
                container.appendChild(div);
            });
            updateText();
            if (images.length > 1) setInterval(nextSlide, 7000);
        }

        function updateText() {
            const currentImg = images[currentIndex];
            const data = projectData[currentImg] || { title: 'Fiore Original', subtitle: 'Design Archive', description: 'Exploring the future of form.', extra: '' };
            
            infoBox.classList.remove('active');
            setTimeout(() => {
                document.getElementById('info-title').innerText = data.title;
                document.getElementById('info-subtitle').innerText = data.subtitle;
                document.getElementById('panel-title').innerText = data.title;
                document.getElementById('panel-text').innerText = data.description;
                document.getElementById('panel-extra').innerText = data.extra;
                infoBox.classList.add('active');
            }, 800);
        }

        function nextSlide() {
            const slides = document.querySelectorAll('.slide');
            slides[currentIndex].classList.remove('active');
            currentIndex = (currentIndex + 1) % slides.length;
            slides[currentIndex].classList.add('active');
            updateText();
        }

        function openPanel() { document.getElementById('detailsPanel').classList.add('open'); }
        function closePanel() { document.getElementById('detailsPanel').classList.remove('remove'); document.getElementById('detailsPanel').classList.remove('open'); }

        loadImages();
    </script>
</body>
</html>
