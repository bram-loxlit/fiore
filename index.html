<footer class="footer-section" id="inquiries">
        <form class="contact-form" id="fioreForm" onsubmit="handleFormSubmit(event)">
            <input type="hidden" name="_captcha" value="false">
            <input type="hidden" name="_template" value="table">
            
            <h3 style="font-size: 11px; letter-spacing: 5px; margin-bottom: 60px; opacity: 0.4; font-weight: 300;">INQUIRIES</h3>
            
            <input type="text" id="formName" name="Name" placeholder="NAME" required autocomplete="off">
            <input type="email" id="formEmail" name="Email" placeholder="EMAIL" required autocomplete="off">
            <textarea id="formMessage" name="Message" placeholder="MESSAGE" rows="4" required autocomplete="off"></textarea>
            
            <div style="margin-top: 20px;">
                <button type="submit" id="submitBtn" class="form-send-btn">SUBMIT REQUEST</button>
            </div>
        </form>
        <p style="margin-top: 140px; font-size: 8px; opacity: 0.15; letter-spacing: 6px;">© 2026 FIORE | BEYOND TIME</p>
    </footer>

    <style>
        /* Forceer invoervelden om gitzwart en transparant te blijven, elimineer Chrome's lichtblauwe autofill */
        input:-webkit-autofill,
        input:-webkit-autofill:hover, 
        input:-webkit-autofill:focus,
        textarea:-webkit-autofill,
        textarea:-webkit-autofill:hover,
        textarea:-webkit-autofill:focus {
            -webkit-text-fill-color: #fff !important;
            -webkit-box-shadow: 0 0 0px 1000px #000 inset !important;
            transition: background-color 5000s ease-in-out 0s;
        }

        input, textarea {
            border-radius: 0 !important;
            -webkit-appearance: none;
            background-color: transparent !important;
        }

        /* De nieuwe, uiterst chique knop */
        .form-send-btn {
            background: none;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            font-size: 10px;
            letter-spacing: 4px;
            font-family: inherit;
            padding: 18px 40px;
            text-transform: uppercase;
            cursor: pointer;
            transition: border-color 0.4s, background 0.4s, color 0.4s, opacity 0.3s;
            display: inline-block;
            margin-top: 10px;
        }
        .form-send-btn:hover {
            border-color: #fff;
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
        }
    </style>

    <script>
        gsap.registerPlugin(ScrollTrigger);

        // 1. PREMIUM SMOOTH SCROLL (Lenis Engine)
        const lenis = new Lenis({
            duration: 1.2,
            easing: (t) => Math.min(1, 1.001 - Math.pow(2, -10 * t)),
            touchMultiplier: 1.5,
            infinite: false,
        });
        function raf(time) { lenis.raf(time); requestAnimationFrame(raf); }
        requestAnimationFrame(raf);
        lenis.on('scroll', ScrollTrigger.update);

        // 2. ADVANCED GSAP PARALLAX ENGINE
        document.querySelectorAll('.intermission').forEach(sect => {
            const spot = sect.querySelector('.parallax-spotlight');
            const drift = sect.querySelector('.parallax-drift-text');
            const narrative = sect.querySelector('.narrative-container');

            if(spot) { gsap.to(spot, { yPercent: 15, ease: "none", scrollTrigger: { trigger: sect, scrub: true } }); }
            if(drift) { gsap.fromTo(drift, { xPercent: 10 }, { xPercent: -10, ease: "none", scrollTrigger: { trigger: sect, scrub: true } }); }
            if(narrative) {
                gsap.fromTo(narrative, 
                    { y: 100, opacity: 0 }, 
                    { y: -40, opacity: 1, ease: "power2.out", scrollTrigger: { trigger: sect, start: "top 85%", end: "top 25%", scrub: 1 } }
                );
            }
        });

        // Product Images Parallax
        document.querySelectorAll('.product-view').forEach(sect => {
            const bg = sect.querySelector('.section-bg');
            if(bg) { gsap.fromTo(bg, { yPercent: -10 }, { yPercent: 10, ease: "none", scrollTrigger: { trigger: sect, scrub: true } }); }
        });

        // 3. HERO SLIDESHOW SYSTEM
        let hIdx = 0;
        const hSlides = document.querySelectorAll('.hero-slide');
        let heroInterval = setInterval(() => moveHero(1), 6000);

        function moveHero(direction) {
            if(hSlides.length === 0) return;
            hSlides[hIdx].classList.remove('active');
            hIdx = (hIdx + direction + hSlides.length) % hSlides.length;
            hSlides[hIdx].classList.add('active');
            
            clearInterval(heroInterval);
            heroInterval = setInterval(() => moveHero(1), 6000);
        }

        // 4. LOKALE PRODUCT SLIDESHOW SYSTEMS
        document.querySelectorAll('.product-view').forEach(s => {
            const bgs = s.querySelectorAll('.section-bg');
            if(bgs.length > 1) {
                let bIdx = 0;
                let sectInterval = setInterval(() => changeBg(1), 5000);

                function changeBg(direction) {
                    bgs[bIdx].classList.remove('active');
                    bIdx = (bIdx + direction + bgs.length) % bgs.length;
                    bgs[bIdx].classList.add('active');
                }

                s.moveBg = function(direction) {
                    changeBg(direction);
                    clearInterval(sectInterval);
                    sectInterval = setInterval(() => changeBg(1), 5000);
                };
            }
        });

        function moveSection(arrowElement, direction) {
            const parentSection = arrowElement.closest('section');
            if (parentSection && typeof parentSection.moveBg === 'function') {
                parentSection.moveBg(direction);
            }
        }

        // 5. THE DESIGN ARCHIVE DATASTACK
        const projects = {
            'starfish': {
                title: 'Starfish Table',
                details: [
                    { label: 'Classification', value: 'Biomorphic Radially-Centered Table Architecture' },
                    { label: 'Scale Metrics', value: 'H 740 mm | Ø 1400 mm' },
                    { label: 'Execution ST-01', value: 'Base: Soul-Red Metallic // Top: Carbon-Injected Noir de Mazy (Archived)' },
                    { label: 'Execution ST-02', value: 'Base: Titanium Black // Top: Radially Bookmatched Macassar Ebony (Reserved)' },
                    { label: 'Execution ST-03', value: 'Base: Emerald Green Liquid Chrome // Top: Patagonia Quartzite Slab (Available)' },
                    { label: 'Lead-Time', value: '18 Weeks // Handmade in Antwerp Laboratory' }
                ]
            },
            'drop-ripple': {
                title: 'Drop & Ripple',
                details: [
                    { label: 'Classification', value: 'Integrated Domestic Topography System' },
                    { label: 'Scale Metrics', value: 'Table Body: 2400 x 1100 mm // Landscape Rug: 3500 x 2500 mm' },
                    { label: 'Material DNA', value: 'Solid Black Walnut Slab, Hand-knotted Tibetan Silk & Wool' },
                    { label: 'Lead-Time', value: '14 Weeks // Certified Pièce Unique' }
                ]
            },
            'fd8': {
                title: 'FD8 Executive',
                details: [
                    { label: 'Classification', value: 'Monolithic Executive Workspace Layer' },
                    { label: 'Scale Metrics', value: '2200 x 1000 x 750 mm' },
                    { label: 'Material DNA', value: 'Anodized Aerospace Titanium Frame, Compression-molded Matte Carbon' },
                    { label: 'Lead-Time', value: '18 Weeks // Limited Commission Execution' }
                ]
            },
            'dodragao': {
                title: 'Do Dragao',
                details: [
                    { label: 'Classification', value: 'Anatomical Daybed Sculpture' },
                    { label: 'Scale Metrics', value: 'L 2100 mm // W 950 mm // H 650 mm' },
                    { label: 'Material DNA', value: 'Cast Magnesium Internal Skeleton, Full-grain Liquid Aniline Hide' },
                    { label: 'Lead-Time', value: '16 Weeks // Engineered on Custom Commission' }
                ]
            },
            'about': {
                title: 'FIORE LABS // ABOUT',
                details: [
                    { label: 'Core Identity', value: 'Procedural Art & Digital Permanent Artifacts' },
                    { label: 'Coordinates', value: '51.2194° N, 4.4025° E // Antwerp Laboratory' },
                    { label: 'Philosophy', value: 'Form follows emotion, frozen beyond traditional physical lifecycles.' }
                ]
            }
        };

        // 6. ULTRA-MINIMALIST TYPE INJECTOR
        function toggleDetails(element, id) {
            const parentSection = element.closest('section');
            const panel = parentSection.querySelector('.side-panel');
            const plusTrigger = parentSection.querySelector('.plus-trigger');
            const panelData = parentSection.querySelector('.panel-data');
            
            if (!panel) return;
            
            if (panel.classList.contains('open')) {
                panel.classList.remove('open');
                plusTrigger.style.transform = 'rotate(0deg)';
            } else {
                const p = projects[id];
                if(!p) return;
                
                let cleanHTML = `<div class="matrix-header">${p.title} // Structural Specifications</div>`;
                
                p.details.forEach(item => {
                    cleanHTML += `
                        <div class="matrix-row">
                            <div class="matrix-meta">${item.label}</div>
                            <div class="matrix-title">${item.value}</div>
                        </div>
                    `;
                });

                cleanHTML += `
                    <div class="panel-inquiry-container">
                        <div class="panel-inquiry-link" onclick="scrollToInquiries(this)" ontouchstart="scrollToInquiries(this)">Inquire for acquisition</div>
                    </div>
                `;
                
                panelData.innerHTML = cleanHTML;
                panel.classList.add('open');
                plusTrigger.style.transform = 'rotate(45deg)';
            }
        }

        document.addEventListener("touchstart", function(){}, true);

        function scrollToInquiries(linkElement) {
            const parentSection = linkElement.closest('section');
            const panel = parentSection.querySelector('.side-panel');
            const plusTrigger = parentSection.querySelector('.plus-trigger');
            
            if (panel) panel.classList.remove('open');
            if (plusTrigger) plusTrigger.style.transform = 'rotate(0deg)';
            
            lenis.scrollTo('#inquiries', { duration: 1.5 });
        }

        // 7. BACK-END AJAX SUBMIT SYSTEM WITH ACTIVATION SAFEGUARD
        function handleFormSubmit(event) {
            event.preventDefault();
            const button = document.getElementById('submitBtn');
            const form = document.getElementById('fioreForm');
            
            button.innerText = "SENDING...";
            button.style.pointerEvents = "none";
            button.style.opacity = "0.4";
            
            const formData = new FormData(form);
            
            fetch("https://formsubmit.co/ajax/hi@fio.re", {
                method: "POST",
                body: formData,
                headers: { 'Accept': 'application/json' }
            })
            .then(response => {
                if (response.ok) {
                    button.innerText = "REQUEST SENT";
                    button.style.borderHeader = "1px solid #deff9a";
                    button.style.opacity = "0.9";
                    form.reset();
                    setTimeout(() => {
                        button.innerText = "SUBMIT REQUEST";
                        button.style.pointerEvents = "auto";
                        button.style.borderHeader = "1px solid rgba(255,255,255,0.2)";
                    }, 5000);
                } else {
                    // Als de AJAX-aanvraag faalt, valt het formulier direct elegant terug op de klassieke activatie-methode
                    button.innerText = "REDIRECTING...";
                    form.action = "https://formsubmit.co/hi@fio.re";
                    form.method = "POST";
                    form.removeAttribute('onsubmit'); 
                    form.submit();
                }
            })
            .catch(error => {
                // Fail-safe voor de allereerste activatie vanaf localhost of GitHub Pages
                button.innerText = "REDIRECTING...";
                form.action = "https://formsubmit.co/hi@fio.re";
                form.method = "POST";
                form.removeAttribute('onsubmit');
                form.submit();
            });
        }
    </script>
