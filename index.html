<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FIORE</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            height: 100%;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #000;
            overflow: hidden;
        }

        /* The Hero Background - Matched to your filename: hero.png */
        .hero {
            height: 100vh;
            width: 100%;
            background: linear-gradient(rgba(0, 0, 0, 0.1), rgba(0, 0, 0, 0.4)), 
                        url('hero.png') no-repeat center center;
            background-size: cover;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* Logo Styling - Matched to your filename: Logo.png */
        .logo-container {
            width: 85%;
            max-width: 500px;
            z-index: 10;
            transition: transform 0.8s cubic-bezier(0.2, 1, 0.3, 1);
        }

        .logo-container img {
            width: 100%;
            height: auto;
            /* Subtle glow to make the white logo pop against the hair */
            filter: drop-shadow(0 0 20px rgba(255, 255, 255, 0.25));
        }

        .logo-container:hover {
            transform: scale(1.03);
        }

        /* Bottom Credits */
        .footer {
            position: absolute;
            bottom: 40px;
            color: rgba(255, 255, 255, 0.7);
            font-size: 11px;
            letter-spacing: 4px;
            text-transform: uppercase;
            text-align: center;
            width: 100%;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .copyright {
            font-size: 9px;
            opacity: 0.5;
            margin-top: 12px;
            display: block;
            letter-spacing: 2px;
        }

        /* Smooth entrance animation */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .hero > * {
            animation: fadeIn 2.5s ease-out forwards;
        }
    </style>
</head>
<body>

    <section class="hero">
        <div class="logo-container">
            <img src="Logo.png" alt="FIORE Logo">
        </div>

        <div class="footer">
            A Portrait | Profile & Gallery
            <span class="copyright">
                © 2026 FIORE. All rights reserved.
            </span>
        </div>
    </section>

</body>
</html>
