<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FIORE</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { height: 100%; font-family: 'Inter', sans-serif; background-color: #000; overflow: hidden; color: #fff; }

        .slideshow-container { position: fixed; width: 100%; height: 100vh; z-index: 1; overflow: hidden; }
        
        .slide { 
            position: absolute; width: 100%; height: 100%; 
            background-size: cover; background-position: center; 
            opacity: 0; transition: opacity 2s ease-in-out; 
        }
        .slide.active { opacity: 1; }
        .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.1); z-index: 2; }

        /* Aangepaste logo-container voor een strakkere hoek-uitlijning */
        .logo-container { 
            position: absolute; 
            top: 25px;      /* Hoger naar de rand */
            left: 30px;     /* Verder naar links */
            width: 140px;   /* Iets compacter en eleganter */
            z-index: 10; 
        }
        .logo-container img { width: 100%; filter: drop-shadow(0 2px 10px rgba(0, 0, 0, 0.3)); }

        .footer { position: absolute; bottom: 50px; width: 100%; text-align: center; z-index: 10; letter-spacing: 6px; text-transform: uppercase; }
        .baseline { font-size: 11px; font-weight: 300; color: rgba(255, 255, 255, 0.9); display: block; margin-bottom: 10px; }
        .copyright { font-size: 8px; opacity: 0.4; letter-spacing: 2px; }
    </style>
</head>
<body>

    <div id="slideshow" class="slideshow-container">
        <div class="overlay"></div>
    </div>

    <div class="logo-container">
        <img src="Logo.png" alt="FIORE Logo">
    </div>

    <div class="footer">
        <span class="baseline">Beyond Time | Through Design</span>
        <span class="copyright">© 2026 FIORE. All rights reserved.</span>
    </div>

    <script>
        const container = document.getElementById('slideshow');
        // We beginnen met de hoofd-image 'hero.png'
        const images = ['hero.png']; 
        let currentIndex = 0;

        async function loadImages() {
            let i = 1;
            let searching = true;

            // Zoekt automatisch naar hero1.png, hero2.png, hero3.png, etc.
            while (searching && i < 20) { 
                const filename = `hero${i}.png`;
                try {
                    const response = await fetch(filename, { method: 'HEAD' });
                    if (response.ok) {
                        images.push(filename);
                        i++;
                    } else {
                        searching = false;
                    }
                } catch (e) {
                    searching = false;
                }
            }
            
            images.forEach((img, index) => {
                const div = document.createElement('div');
                div.className = `slide ${index === 0 ? 'active' : ''}`;
                div.style.backgroundImage = `url('${img}')`;
                container.appendChild(div);
            });

            if (images.length > 1) {
                setInterval(nextSlide, 5000);
            }
        }

        function nextSlide() {
            const slides = document.querySelectorAll('.slide');
            if (slides.length === 0) return;
            slides[currentIndex].classList.remove('active');
            currentIndex = (currentIndex + 1) % slides.length;
            slides[currentIndex].classList.add('active');
        }

        loadImages();
    </script>
</body>
</html>
